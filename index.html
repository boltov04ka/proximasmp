<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ProximaSMP</title><link rel="stylesheet" href="style.css"></head><body><main><div class="layout">
<div class="left"><img class="ava" src="assets/ава.png" alt="ProximaSMP"><button class="ip action" id="copy"><img src="assets/айпи.png" alt="Скопировать IP"><span class="comment">Нажми, чтобы скопировать IP</span></button></div>
<a class="tile shop" href="shop.html"><img src="assets/магазин.png" alt="Магазин"><span class="comment">Открыть магазин</span></a>
<a class="tile discord" href="https://discord.gg/3hXqDZ5uQR" target="_blank" rel="noopener"><img src="assets/дискорд.png" alt="Discord"><span class="comment">Присоединиться к Discord</span></a>
<a class="tile how" href="https://www.youtube.com/@proximamc" target="_blank" rel="noopener"><img src="assets/как играть.png" alt="Как играть"><span class="comment">Посмотреть, как играть</span></a>
</div><footer>proximasmp.su</footer></main><script>const b=document.getElementById('copy');b.onclick=async()=>{try{await navigator.clipboard.writeText('proximasmp.su')}catch(e){const x=document.createElement('textarea');x.value='proximasmp.su';document.body.appendChild(x);x.select();document.execCommand('copy');x.remove()}b.classList.add('done');setTimeout(()=>b.classList.remove('done'),1500)}</script></body></html>
