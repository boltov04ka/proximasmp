<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProximaSMP</title>
  <meta name="description" content="ProximaSMP — Minecraft сервер">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="grid">
      <!-- Логотип/ава: НЕ кликабельная -->
      <div class="avatar-card">
        <img src="assets/avatar.png" alt="ProximaSMP" class="avatar">
        <div class="server-name">PROXIMASMP</div>
      </div>

      <!-- Как играть -->
      <a class="card wide hover-card" href="https://www.youtube.com/@proximamc" target="_blank" rel="noopener">
        <img src="assets/how-to-play.png" alt="Как играть">
        <span class="hover-comment">▶ Как играть на ProximaSMP</span>
        <span class="card-title">Как играть</span>
      </a>

      <!-- Discord -->
      <a class="card discord-card hover-card" href="https://discord.gg/3hXqDZ5uQR" target="_blank" rel="noopener">
        <img src="assets/discord.png" alt="Discord">
        <span class="hover-comment">💬 Присоединиться к Discord</span>
        <span class="discord-label">Discord</span>
      </a>

      <!-- IP / копирование -->
      <button class="card ip-card hover-card" id="copyIp" type="button" aria-label="Скопировать IP ProximaSMP">
        <img src="assets/ip.png" alt="Скопировать IP">
        <span class="hover-comment">📋 Нажми, чтобы скопировать IP</span>
        <span class="copy-status" id="copyStatus">proximasmp.su</span>
      </button>

      <!-- Магазин -->
      <a class="card shop-card hover-card" href="shop.html">
        <img src="assets/shop.png" alt="Магазин ProximaSMP">
        <span class="hover-comment">🛒 Открыть магазин</span>
        <span class="card-title">Магазин</span>
      </a>
    </section>

    <footer>
      <div class="footer-brand">proximasmp.su</div>
      <div class="footer-note">Minecraft сервер ProximaSMP</div>
    </footer>
  </main>

  <script>
    const button = document.getElementById('copyIp');
    const status = document.getElementById('copyStatus');

    button.addEventListener('click', async () => {
      const ip = 'proximasmp.su';
      try {
        await navigator.clipboard.writeText(ip);
        status.textContent = 'Скопировано ✓';
        button.classList.add('copied');
      } catch {
        // Fallback for browsers where Clipboard API is unavailable.
        const area = document.createElement('textarea');
        area.value = ip;
        area.style.position = 'fixed';
        area.style.opacity = '0';
        document.body.appendChild(area);
        area.select();
        document.execCommand('copy');
        area.remove();
        status.textContent = 'Скопировано ✓';
        button.classList.add('copied');
      }
      setTimeout(() => {
        status.textContent = ip;
        button.classList.remove('copied');
      }, 1800);
    });
  </script>
</body>
</html>
